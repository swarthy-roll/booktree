# at least one file type must be true in order to process files.
file_types_to_process:
  epub: true
  pdf: false

# this is the source directory where all the files to be processed reside.
source_directory: C:\Users\Aaron\Documents\ebooks

# this is the directory where hardlinked or copied files will be sent to.
target_directory: C:\Users\Aaron\Documents\target

# determines whether an opf file is generated for each processed file. recommended setting is true.
create_opf_files: true

# the available options from which to fetch metadata. goodreads is only an available option for ebooks. all valid files are probed for any existing metadata.
fetch_metadata_from:
  goodreads: true
  audible: false
  mam: false

# when scraping goodreads, this option determines whether the browser (scraper) runs in the background ("true") or if it's visible ("false"). "true" is recommended.
headless_mode: true

# when generating OPF files, metadata will be generated from sources in order of the preference specified here. 
# note that for a source to be valid, it must be enabled in the fetch_metadata_from setting.
metadata_preference:
  - goodreads
  - mam
  - file_metadata
  - audible

# sets the level of logging. the available levels (from fewest messages to most messages) are: CRITICAL, ERROR, WARNING, INFO, DEBUG:
#   - CRITICAL: This level indicates a serious error, often meaning the application may not be able to continue running.
#   - ERROR: Used for errors that prevent part of the program from functioning but might not halt the entire application.
#   - WARNING: Warnings are for potentially problematic situations that don’t prevent the application from running but may require attention.
#   - INFO: Informational messages that highlight the progress of the application at a coarse-grained level.
#   - DEBUG: Detailed information for diagnosing problems, typically used during development.
# the recommended level for normal operation is ERROR or WARNING so that only important messages are shown. set to INFO to see progress details.
log_level: DEBUG